name: Esplora UWW

on:
  workflow_dispatch:
    inputs:
      indirizzo:
        description: "Indirizzo della pagina da esplorare"
        required: true

jobs:
  esplora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python esplora_uww.py
        env:
          PAGE_URL: ${{ inputs.indirizzo }}
