name: Agente Squash

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      solo_prova:
        description: "Solo prova (non scrive su Notion)"
        type: boolean
        default: true

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRY_RUN: ${{ github.event.inputs.solo_prova }}
