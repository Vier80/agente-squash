name: Esplora Judo 3

on:
  workflow_dispatch:

jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa il necessario
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Esamina il ranking olimpico IJF
        run: python -u esplora_judo3.py
